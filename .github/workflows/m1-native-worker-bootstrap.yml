name: M1 native worker bootstrap

on:
  push:
    branches:
      - feature/m1-read-only-discovery

permissions:
  contents: write

jobs:
  normalize-native-worker-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Export in-process worker surface
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("crates/fido-service/src/lib.rs")
          text = path.read_text()

          if "mod in_process_worker;" not in text:
              text = text.replace(
                  "mod discovery;\n",
                  "mod discovery;\nmod in_process_worker;\n",
                  1,
              )

          marker = """pub use discovery::{
              DiscoveryCoordinator, DiscoveryError, DiscoveryPolicy, DiscoveryPolicyError,
              RegisteredDeviceTarget, WorkerEndpoint, WorkerEndpointError,
          };
          """
          exports = marker + """
          pub use in_process_worker::InProcessWorkerEndpoint;
          #[cfg(feature = \"native-libfido2\")]
          pub use in_process_worker::spawn_libfido2_worker;
          """
          if "pub use in_process_worker::InProcessWorkerEndpoint;" not in text:
              if marker not in text:
                  raise SystemExit("discovery export marker not found")
              text = text.replace(marker, exports, 1)

          path.write_text(text)
          PY

      - name: Setup pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Regenerate lockfile and format
        run: |
          cargo +1.98.1 generate-lockfile
          cargo +1.98.1 fmt --all

      - name: Validate focused crates
        run: |
          cargo +1.98.1 clippy -p fido-libfido2 -p fido-service --all-targets --locked -- -D warnings
          cargo +1.98.1 test -p fido-libfido2 -p fido-service --locked

      - name: Commit normalized slice and remove bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m1-native-worker-bootstrap.yml
          git add Cargo.lock crates/fido-libfido2 crates/fido-service
          git commit -m "feat: add in-process libfido2 discovery worker"
          git push origin HEAD:feature/m1-read-only-discovery
