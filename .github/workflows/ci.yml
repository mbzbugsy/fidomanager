name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.17.1

      - name: Install frontend dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Frontend boundary check
        run: pnpm security:renderer-boundary

      - name: Frontend formatting
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Setup Rust
        run: |
          rustup set profile minimal
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Upload generated lockfiles for bootstrap PR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m0-generated-lockfiles
          path: |
            Cargo.lock
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
