name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.17.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer boundary check
        run: pnpm security:renderer-boundary

      - name: Frontend formatting
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libcbor-dev \
            libfido2-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Setup pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Pinned native source and allocation-bound tests (no Linux enablement)
        run: |
          python3 scripts/build-libfido2.py fetch
          python3 scripts/test-libfido2.py

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Resolved renderer ACL check
        run: pnpm security:renderer-boundary

      - name: Rust tests
        # Linux covers discovery and deterministic auth contracts, never native PUAT.
        run: cargo test --workspace --all-targets --locked

  macos-native-auth:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private native build prerequisites
        run: |
          # System libfido2 is installed ONLY for the negative linkage control.
          brew install cmake pkg-config openssl@3 libcbor libfido2
          python3 scripts/build-libfido2.py fetch
      - name: Setup pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Native parser bounds, negative linkage and reproducible build
        run: python3 scripts/test-libfido2.py --rebuild
      - name: Compile production AppKit and PUAT path
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Deterministic macOS auth and process tests (no hardware claim)
        run: cargo test --workspace --all-targets --locked
      - name: Verify production worker's exact private static linkage
        run: |
          cargo build -p fido-worker --locked
          python3 scripts/verify-libfido2-linkage.py target/debug/fido-worker
