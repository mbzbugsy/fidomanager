name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release verification and provenance policy tests (synthetic, no signing claim)
        run: |
          python3 scripts/test-release-verification.py
          python3 scripts/test-release-provenance.py

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.17.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer boundary check
        run: pnpm security:renderer-boundary

      - name: Frontend formatting
        run: |
          pnpm exec prettier scripts/test-frontend-sbom.mjs
          pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend SBOM stylesheet inventory regression
        run: node --test scripts/test-frontend-sbom.mjs

      - name: Frontend build
        run: pnpm build

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libcbor-dev \
            libfido2-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Setup pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Pinned native source and allocation-bound tests (no Linux enablement)
        run: |
          python3 scripts/build-libfido2.py fetch
          python3 scripts/test-libfido2.py

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Resolved renderer ACL check
        run: pnpm security:renderer-boundary

      - name: Rust tests
        # Linux covers discovery and deterministic auth contracts, never native PUAT.
        run: cargo test --workspace --all-targets --locked
      - name: Service security contract doctests
        run: cargo test -p fido-service --doc --locked

  macos-native-auth:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private native build prerequisites
        run: |
          # System libfido2 (and the Homebrew openssl@3/libcbor it pulls in) is installed ONLY for
          # the negative linkage control; the private build must ignore all three.
          brew install cmake pkg-config libfido2
          python3 scripts/build-libfido2.py fetch
      - name: Setup pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Native parser bounds, negative linkage and reproducible build
        run: python3 scripts/test-libfido2.py --rebuild
      - name: Compile production AppKit, PIN mutation and PUAT paths
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Deterministic macOS auth and process tests (no hardware claim)
        run: cargo test --workspace --all-targets --locked
      - name: Service security contract doctests
        run: cargo test -p fido-service --doc --locked
      - name: Verify credential and PIN mutation symbols against exact private archive link map
        run: |
          # Bin test harnesses share the link-map output; force a fresh production link.
          cargo clean -p fido-worker
          cargo build -p fido-worker --locked
          python3 scripts/test-credman-linkage.py
          python3 scripts/verify-libfido2-linkage.py target/debug/fido-worker

  macos-packaging:
    # Unsigned packaging smoke test (ad-hoc seal only). This workflow has no signing secrets;
    # Developer ID signing, notarization and stapling belong to a later protected release
    # workflow. The bundle and DMG are never uploaded or published.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release verification and provenance policy tests (synthetic, no signing claim)
        run: |
          python3 scripts/test-release-verification.py
          python3 scripts/test-release-provenance.py

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Renderer boundary check
        run: pnpm security:renderer-boundary
      - name: Native build prerequisites (no Homebrew openssl@3, libcbor or libfido2)
        run: |
          # Build tools only. libcrypto/libcbor/libfido2 come from checksum-pinned source.
          brew install cmake pkg-config
          python3 scripts/build-libfido2.py fetch
      - name: Pinned native source locks, strict extraction and third-party notices
        run: python3 scripts/test-native-deps.py
      - name: Setup pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Assemble and check unsigned Fido Manager.app and DMG
        # Builds private static OpenSSL, libcbor and libfido2, the release worker, verifies link-map
        # provenance, then the bundle, ad-hoc seal, structural checks and DMG.
        run: python3 scripts/package-macos.py --dmg
      - name: Collect target-specific SBOM build inputs (no signing credentials)
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          python3 scripts/release-provenance.py collect-sbom --target "$triple" \
            --frontend target/macos-package/frontend-sbom-inputs.json \
            --output target/macos-package/sbom-inputs.json
          python3 scripts/test-release-provenance.py
      - name: Release worker static provenance and dynamic dependencies
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          python3 scripts/verify-libfido2-linkage.py "target/$triple/release/fido-worker"
          otool -L "target/macos-package/Fido Manager.app/Contents/MacOS/fido-worker"
          test ! -e "target/macos-package/Fido Manager.app/Contents/Frameworks"
      - name: Bundle checker regression tests
        run: python3 scripts/test-macos-bundle-check.py "target/macos-package/Fido Manager.app"
      - name: Packaged worker handshake and health check (no authenticator access)
        env:
          FIDOMANAGER_PACKAGED_WORKER: ${{ github.workspace }}/target/macos-package/Fido Manager.app/Contents/MacOS/fido-worker
        run: cargo test -p fido-worker --test packaged_worker --locked -- --ignored
      - name: Packaging leaves the reviewed tree unchanged
        run: |
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then echo "$status"; exit 1; fi
