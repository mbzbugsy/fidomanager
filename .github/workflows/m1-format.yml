name: M1 alpha format

on:
  push:
    branches:
      - feature/m1-read-only-discovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - run: npm install --global pnpm@10.17.1
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt

      - name: Format project sources
        run: |
          pnpm format
          cargo +1.98.1 fmt --all

      - name: Commit normalized source formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri scripts crates/fido-service/src/lib.rs
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: normalize first alpha sources"
          git push origin HEAD:feature/m1-read-only-discovery
