          }

          .mode-pill {
            color: #a8b0ac;
          }

          .workspace {
            width: min(1180px, calc(100% - 3rem));
            margin: 0 auto;
            padding: 3.2rem 0 2.5rem;
            flex: 1;
          }

          .intro {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 2rem;
            padding-bottom: 2.4rem;
          }

          .eyebrow,
          .section-kicker,
          .capability-label {
            margin: 0;
            color: var(--accent);
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.13em;
          }

          h1 {
