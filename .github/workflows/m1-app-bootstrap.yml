name: M1 app bootstrap

on:
  push:
    branches:
      - feature/m1-read-only-discovery

permissions:
  contents: write

jobs:
  build-first-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply native app integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('crates/fido-service/src/lib.rs')
          text = service.read_text()
          export_marker = '''#[cfg(feature = "native-libfido2")]
          pub use in_process_worker::spawn_libfido2_worker;
          '''
          export_replacement = export_marker + '''
          pub use fido_core::{DeviceListSnapshot, DeviceReadStatus, ViewFreshness};
          '''
          if 'pub use fido_core::{DeviceListSnapshot, DeviceReadStatus, ViewFreshness};' not in text:
              if export_marker not in text:
                  raise SystemExit('service export marker not found')
              text = text.replace(export_marker, export_replacement, 1)

          foundation_marker = '''pub const fn foundation_info() -> FoundationInfo {
              FoundationInfo {
                  phase: "milestone-1-read-only-discovery",
                  worker_protocol_version: fido_worker_protocol::WORKER_PROTOCOL_VERSION,
                  reviewed_libfido2_baseline: REVIEWED_LIBFIDO2_BASELINE,
              }
          }
          '''
          session_code = foundation_marker + '''
          #[cfg(feature = "native-libfido2")]
          #[derive(Debug, Error)]
          pub enum NativeDiscoverySessionError {
              #[error(transparent)]
              Endpoint(#[from] WorkerEndpointError),
              #[error(transparent)]
              Policy(#[from] DiscoveryPolicyError),
          }

          /// One persistent native discovery authority for the lifetime of the desktop app.
          ///
          /// The Tauri adapter owns exactly one instance and never receives native paths or
          /// worker-local device identifiers.
          #[cfg(feature = "native-libfido2")]
          pub struct NativeDiscoverySession {
              coordinator: DiscoveryCoordinator<InProcessWorkerEndpoint>,
          }

          #[cfg(feature = "native-libfido2")]
          impl NativeDiscoverySession {
              pub fn new() -> Result<Self, NativeDiscoverySessionError> {
                  let generation = fido_worker_protocol::WorkerGeneration(1);
                  let endpoint = spawn_libfido2_worker(generation)?;
                  let coordinator = DiscoveryCoordinator::new(
                      endpoint,
                      generation,
                      DiscoveryPolicy::default(),
                  )?;
                  Ok(Self { coordinator })
              }

              pub fn refresh(&mut self) -> Result<DeviceListSnapshot, DiscoveryError> {
                  self.coordinator.refresh()
              }
          }
          '''
          if 'pub struct NativeDiscoverySession' not in text:
              if foundation_marker not in text:
                  raise SystemExit('foundation marker not found')
              text = text.replace(foundation_marker, session_code, 1)
          service.write_text(text)

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text()
          old = 'fido-service = { path = "../crates/fido-service" }'
          new = 'fido-service = { path = "../crates/fido-service", features = ["native-libfido2"] }'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Tauri fido-service dependency marker not found')
          cargo.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          if 'libfido2-dev' not in text:
              marker = '            libssl-dev \\\n            libwebkit2gtk-4.1-dev \\\n'
              replacement = '            libssl-dev \\\n            libfido2-dev \\\n            libwebkit2gtk-4.1-dev \\\n'
              if marker not in text:
                  raise SystemExit('CI apt marker not found')
              text = text.replace(marker, replacement, 1)
          ci.write_text(text)
          PY

          cat > src-tauri/src/commands/mod.rs <<'EOF'
          use std::sync::Arc;

          use serde::Serialize;

          use crate::AppState;

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct FoundationStatus {
              phase: &'static str,
              worker_protocol_version: u16,
              reviewed_libfido2_baseline: &'static str,
          }

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct AuthenticatorList {
              enumeration_epoch: String,
              devices: Vec<AuthenticatorSummary>,
          }

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct AuthenticatorSummary {
              handle: String,
              generation: String,
              vendor_id: u16,
              product_id: u16,
              manufacturer: Option<String>,
              product: Option<String>,
              aaguid: Option<String>,
              versions: Vec<String>,
              extensions: Vec<String>,
              transports: Vec<String>,
              options: Vec<AuthenticatorOption>,
              max_message_size: Option<String>,
              firmware_version: Option<String>,
              read_status: &'static str,
              freshness: &'static str,
          }

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct AuthenticatorOption {
              name: String,
              enabled: bool,
          }

          #[tauri::command]
          pub fn foundation_status() -> FoundationStatus {
              let info = fido_service::foundation_info();
              FoundationStatus {
                  phase: info.phase,
                  worker_protocol_version: info.worker_protocol_version,
                  reviewed_libfido2_baseline: info.reviewed_libfido2_baseline,
              }
          }

          #[tauri::command]
          pub async fn list_authenticators(
              state: tauri::State<'_, AppState>,
          ) -> Result<AuthenticatorList, String> {
              let discovery = Arc::clone(&state.discovery);
              tauri::async_runtime::spawn_blocking(move || {
                  let mut session = discovery
                      .lock()
                      .map_err(|_| "native discovery authority lock is poisoned".to_owned())?;
                  session
                      .refresh()
                      .map(AuthenticatorList::from)
                      .map_err(|error| error.to_string())
              })
              .await
              .map_err(|error| format!("native discovery task failed: {error}"))?
          }

          impl From<fido_service::DeviceListSnapshot> for AuthenticatorList {
              fn from(snapshot: fido_service::DeviceListSnapshot) -> Self {
                  Self {
                      enumeration_epoch: snapshot.enumeration_epoch.0.to_string(),
                      devices: snapshot
                          .devices
                          .into_iter()
                          .map(|device| AuthenticatorSummary {
                              handle: format!("{:032x}", device.handle.as_raw()),
                              generation: device.generation.0.to_string(),
                              vendor_id: device.vendor_id,
                              product_id: device.product_id,
                              manufacturer: device.manufacturer,
                              product: device.product,
                              aaguid: device.aaguid.map(|value| {
                                  format!("{:032x}", u128::from_be_bytes(*value.as_bytes()))
                              }),
                              versions: device.versions,
                              extensions: device.extensions,
                              transports: device.transports,
                              options: device
                                  .options
                                  .into_iter()
                                  .map(|option| AuthenticatorOption {
                                      name: option.name,
                                      enabled: option.enabled,
                                  })
                                  .collect(),
                              max_message_size: device.max_message_size.map(|value| value.to_string()),
                              firmware_version: device.firmware_version.map(|value| value.to_string()),
                              read_status: read_status_name(device.read_status),
                              freshness: freshness_name(device.freshness),
                          })
                          .collect(),
                  }
              }
          }

          const fn read_status_name(status: fido_service::DeviceReadStatus) -> &'static str {
              match status {
                  fido_service::DeviceReadStatus::Ready => "ready",
                  fido_service::DeviceReadStatus::Busy => "busy",
                  fido_service::DeviceReadStatus::AccessDenied => "access_denied",
                  fido_service::DeviceReadStatus::TimedOut => "timed_out",
                  fido_service::DeviceReadStatus::Unsupported => "unsupported",
                  fido_service::DeviceReadStatus::Unavailable => "unavailable",
                  fido_service::DeviceReadStatus::Malformed => "malformed",
                  fido_service::DeviceReadStatus::Error => "error",
              }
          }

          const fn freshness_name(freshness: fido_service::ViewFreshness) -> &'static str {
              match freshness {
                  fido_service::ViewFreshness::Fresh => "fresh",
                  fido_service::ViewFreshness::Stale => "stale",
                  fido_service::ViewFreshness::Incomplete => "incomplete",
              }
          }
          EOF

          cat > src-tauri/src/lib.rs <<'EOF'
          mod commands;

          use std::sync::{Arc, Mutex};

          use tauri::Manager;

          pub(crate) struct AppState {
              discovery: Arc<Mutex<fido_service::NativeDiscoverySession>>,
          }

          pub fn run() {
              let discovery = match fido_service::NativeDiscoverySession::new() {
                  Ok(session) => Arc::new(Mutex::new(session)),
                  Err(error) => {
                      eprintln!("failed to initialize native discovery: {error}");
                      std::process::exit(1);
                  }
              };

              let result = tauri::Builder::default()
                  // Security invariant: single-instance is registered before any future plugin.
                  .plugin(tauri_plugin_single_instance::init(|app, _args, _cwd| {
                      // Second-launch arguments are intentionally ignored: they are untrusted input.
                      if let Some(window) = app.get_webview_window("main") {
                          let _ = window.unminimize();
                          let _ = window.show();
                          let _ = window.set_focus();
                      }
                  }))
                  .manage(AppState { discovery })
                  .invoke_handler(tauri::generate_handler![
                      commands::foundation_status,
                      commands::list_authenticators,
                  ])
                  .run(tauri::generate_context!());

              if let Err(error) = result {
                  eprintln!("failed to run FidoManager: {error}");
                  std::process::exit(1);
              }
          }
          EOF

          cat > src-tauri/build.rs <<'EOF'
          fn main() {
              let attributes = tauri_build::Attributes::new().app_manifest(
                  tauri_build::AppManifest::new()
                      .commands(&["foundation_status", "list_authenticators"]),
              );

              if let Err(error) = tauri_build::try_build(attributes) {
                  eprintln!("failed to run tauri-build: {error}");
                  std::process::exit(1);
              }
          }
          EOF

          cat > src-tauri/capabilities/main.json <<'EOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "main",
            "description": "Milestone 1 renderer capability: foundation status and read-only authenticator discovery only.",
            "windows": ["main"],
            "permissions": ["allow-foundation-status", "allow-list-authenticators"]
          }
          EOF

          cat > src-tauri/permissions/autogenerated/list_authenticators.toml <<'EOF'
          # Automatically generated - DO NOT EDIT!

          [[permission]]
          identifier = "allow-list-authenticators"
          description = "Enables the list_authenticators command without any pre-configured scope."
          commands.allow = ["list_authenticators"]

          [[permission]]
          identifier = "deny-list-authenticators"
          description = "Denies the list_authenticators command without any pre-configured scope."
          commands.deny = ["list_authenticators"]
          EOF

          cat > scripts/check-renderer-boundary.mjs <<'EOF'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import { join, relative } from 'node:path';

          const EXPECTED_CAPABILITY = 'main';
          const EXPECTED_COMMANDS = ['foundation_status', 'list_authenticators'];
          const EXPECTED_PERMISSIONS = [
            'allow-foundation-status',
            'allow-list-authenticators',
          ];

          function listFiles(root, predicate) {
            const files = [];
            for (const entry of readdirSync(root, { withFileTypes: true })) {
              const path = join(root, entry.name);
              if (entry.isDirectory()) {
                files.push(...listFiles(path, predicate));
              } else if (predicate(path)) {
                files.push(path);
              }
            }
            return files;
          }

          function assertExactArray(actual, expected, message) {
            if (
              !Array.isArray(actual) ||
              actual.length !== expected.length ||
              actual.some((value, index) => value !== expected[index])
            ) {
              throw new Error(message);
            }
          }

          const capabilityFiles = listFiles(
            'src-tauri/capabilities',
            (path) => path.endsWith('.json') || path.endsWith('.toml'),
          ).map((path) => relative('src-tauri/capabilities', path));

          assertExactArray(
            capabilityFiles,
            ['main.json'],
            'Milestone 1 must have exactly one explicitly selected capability file: main.json.',
          );

          const capability = JSON.parse(
            readFileSync('src-tauri/capabilities/main.json', 'utf8'),
          );
          if (capability.identifier !== EXPECTED_CAPABILITY) {
            throw new Error('Milestone 1 renderer capability identifier must be "main".');
          }
          assertExactArray(
            capability.windows,
            ['main'],
            'Milestone 1 renderer capability must target only the main window.',
          );
          assertExactArray(
            capability.permissions,
            EXPECTED_PERMISSIONS,
            'Milestone 1 renderer capability must grant only the approved read-only commands.',
          );
          if ('remote' in capability) {
            throw new Error('Remote capability sources are not approved in Milestone 1.');
          }

          const tauriConfig = JSON.parse(
            readFileSync('src-tauri/tauri.conf.json', 'utf8'),
          );
          assertExactArray(
            tauriConfig?.app?.security?.capabilities,
            [EXPECTED_CAPABILITY],
            'tauri.conf.json must explicitly select only the main capability.',
          );

          const buildSource = readFileSync('src-tauri/build.rs', 'utf8');
          const manifestMatch = buildSource.match(
            /AppManifest::new\(\)[\s\S]*?\.commands\(&\[([^\]]*)\]\)/,
          );
          if (!manifestMatch) {
            throw new Error('Tauri app ACL manifest must explicitly register app commands.');
          }
          const manifestCommands = [
            ...manifestMatch[1].matchAll(/"([A-Za-z_][A-Za-z0-9_]*)"/g),
          ].map((match) => match[1]);
          assertExactArray(
            manifestCommands,
            EXPECTED_COMMANDS,
            'Tauri app ACL manifest does not match the approved Milestone 1 command allowlist.',
          );

          const rustFiles = listFiles('src-tauri/src', (path) => path.endsWith('.rs'));
          const discoveredCommands = [];
          const commandPattern =
            /#\s*\[\s*tauri::command(?:\s*\([^)]*\))?\s*\]\s*(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(([^)]*)\)/g;

          for (const file of rustFiles) {
            const source = readFileSync(file, 'utf8');
            for (const match of source.matchAll(commandPattern)) {
              discoveredCommands.push({
                name: match[1],
                parameters: match[2].trim(),
                file,
              });
            }
          }

          assertExactArray(
            discoveredCommands.map(({ name }) => name),
            EXPECTED_COMMANDS,
            `Milestone 1 must expose exactly the approved app commands; found: ${
              discoveredCommands.map(({ name }) => name).join(', ') || 'none'
            }.`,
          );

          const foundation = discoveredCommands.find(
            ({ name }) => name === 'foundation_status',
          );
          if (!foundation || foundation.parameters !== '') {
            throw new Error('foundation_status must not accept renderer-controlled parameters.');
          }
          const discovery = discoveredCommands.find(
            ({ name }) => name === 'list_authenticators',
          );
          if (
            !discovery ||
            discovery.parameters !== "state: tauri::State<'_, AppState>"
          ) {
            throw new Error(
              'list_authenticators may accept only the authority-owned Tauri State parameter.',
            );
          }

          const appSource = readFileSync('src-tauri/src/lib.rs', 'utf8');
          const handlerMatch = appSource.match(/generate_handler!\[([^\]]*)\]/s);
          if (!handlerMatch) {
            throw new Error('Expected an explicit Tauri generate_handler! registration.');
          }
          const registeredCommands = handlerMatch[1]
            .split(',')
            .map((entry) => entry.trim())
            .filter(Boolean)
            .map((entry) => entry.split('::').at(-1));
          assertExactArray(
            registeredCommands,
            EXPECTED_COMMANDS,
            'Milestone 1 generate_handler! must register only the approved read-only commands.',
          );

          const cargoToml = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const pluginDependencies = [
            ...cargoToml.matchAll(/^([A-Za-z0-9_-]*tauri-plugin-[A-Za-z0-9_-]+)\s*=/gm),
          ].map((match) => match[1]);
          assertExactArray(
            pluginDependencies,
            ['tauri-plugin-single-instance'],
            'Milestone 1 permits only tauri-plugin-single-instance.',
          );
          if (/fido-(?:core|worker-protocol|libfido2)\s*=/.test(cargoToml)) {
            throw new Error(
              'The Tauri adapter must depend on fido-service only among project trust crates.',
            );
          }

          const rendererFiles = listFiles(
            'src',
            (path) => path.endsWith('.ts') || path.endsWith('.svelte'),
          );
          const invokedCommands = new Set();
          for (const file of rendererFiles) {
            const source = readFileSync(file, 'utf8');
            if (source.includes('@tauri-apps/api/event')) {
              throw new Error(`Renderer event API is not approved in Milestone 1: ${file}`);
            }
            if (source.includes('@tauri-apps/plugin-')) {
              throw new Error(`Renderer plugin API is not approved in Milestone 1: ${file}`);
            }
            if (source.includes('__TAURI_INTERNALS__')) {
              throw new Error(`Direct internal Tauri IPC access is not approved: ${file}`);
            }
            for (const match of source.matchAll(
              /invoke(?:<[^>]+>)?\(\s*['"]([^'"]+)['"]/g,
            )) {
              invokedCommands.add(match[1]);
            }
          }
          assertExactArray(
            [...invokedCommands].sort(),
            [...EXPECTED_COMMANDS].sort(),
            'Renderer invoke surface does not match the approved Milestone 1 command allowlist.',
          );

          const generatedCapabilitiesPath = 'src-tauri/gen/schemas/capabilities.json';
          const generatedAclPath = 'src-tauri/gen/schemas/acl-manifests.json';
          if (existsSync(generatedCapabilitiesPath) || existsSync(generatedAclPath)) {
            if (!existsSync(generatedCapabilitiesPath) || !existsSync(generatedAclPath)) {
              throw new Error('Generated Tauri ACL output is incomplete.');
            }

            const generatedCapabilities = JSON.parse(
              readFileSync(generatedCapabilitiesPath, 'utf8'),
            );
            const resolvedMain = generatedCapabilities[EXPECTED_CAPABILITY];
            if (!resolvedMain) {
              throw new Error('Generated Tauri capabilities are missing the main capability.');
            }
            assertExactArray(
              resolvedMain.permissions,
              EXPECTED_PERMISSIONS,
              'Generated Tauri main capability does not resolve to the expected permissions.',
            );

            const generatedAcl = JSON.parse(readFileSync(generatedAclPath, 'utf8'));
            const appAcl = generatedAcl['__app-acl__'];
            if (!appAcl) {
              throw new Error('Generated Tauri ACL is missing the application ACL manifest.');
            }
            const serializedAppAcl = JSON.stringify(appAcl);
            for (const permission of EXPECTED_PERMISSIONS) {
              if (!serializedAppAcl.includes(permission)) {
                throw new Error(`Generated application ACL is missing ${permission}.`);
              }
            }
            for (const command of EXPECTED_COMMANDS) {
              if (!serializedAppAcl.includes(command)) {
                throw new Error(`Generated application ACL is missing ${command}.`);
              }
            }
          }

          console.log('Renderer boundary check passed.');
          EOF

          cat > src/App.svelte <<'EOF'
          <script lang="ts">
            import { invoke } from '@tauri-apps/api/core';
            import { onMount } from 'svelte';

            type FoundationStatus = {
              phase: string;
              workerProtocolVersion: number;
              reviewedLibfido2Baseline: string;
            };

            type AuthenticatorOption = {
              name: string;
              enabled: boolean;
            };

            type Authenticator = {
              handle: string;
              generation: string;
              vendorId: number;
              productId: number;
              manufacturer: string | null;
              product: string | null;
              aaguid: string | null;
              versions: string[];
              extensions: string[];
              transports: string[];
              options: AuthenticatorOption[];
              maxMessageSize: string | null;
              firmwareVersion: string | null;
              readStatus: string;
              freshness: string;
            };

            type AuthenticatorList = {
              enumerationEpoch: string;
              devices: Authenticator[];
            };

            let foundation: FoundationStatus | null = null;
            let snapshot: AuthenticatorList | null = null;
            let discoveryError: string | null = null;
            let refreshing = false;
            let lastScan: string | null = null;
            let stopped = false;
            let timer: ReturnType<typeof setTimeout> | null = null;

            const pollDelayMs = 1000;

            function hex16(value: number) {
              return value.toString(16).padStart(4, '0');
            }

            function friendlyStatus(status: string) {
              return status.replaceAll('_', ' ');
            }

            async function loadFoundation() {
              try {
                foundation = await invoke<FoundationStatus>('foundation_status');
              } catch {
                foundation = null;
              }
            }

            async function refreshDevices(scheduleNext = true) {
              if (refreshing || stopped) return;
              refreshing = true;
              try {
                snapshot = await invoke<AuthenticatorList>('list_authenticators');
                discoveryError = null;
                lastScan = new Date().toLocaleTimeString([], {
                  hour: '2-digit',
                  minute: '2-digit',
                  second: '2-digit',
                });
              } catch (error) {
                discoveryError =
                  typeof error === 'string' ? error : 'Native discovery is unavailable.';
              } finally {
                refreshing = false;
                if (scheduleNext && !stopped) {
                  timer = setTimeout(() => void refreshDevices(), pollDelayMs);
                }
              }
            }

            function refreshNow() {
              if (timer) clearTimeout(timer);
              timer = null;
              void refreshDevices();
            }

            onMount(() => {
              stopped = false;
              void loadFoundation();
              void refreshDevices();
              return () => {
                stopped = true;
                if (timer) clearTimeout(timer);
              };
            });
          </script>

          <svelte:head>
            <title>FidoManager</title>
          </svelte:head>

          <div class="app-frame">
            <header class="topbar">
              <div class="brand" aria-label="FidoManager">
                <div class="brand-mark" aria-hidden="true">
                  <span></span>
                  <span></span>
                </div>
                <div>
                  <strong>FidoManager</strong>
                  <small>Authenticator control</small>
                </div>
              </div>

              <div class="topbar-meta">
                <span class="privacy-pill"><i></i> Local only</span>
                <span class="mode-pill">Read-only alpha</span>
              </div>
            </header>

            <main class="workspace">
              <section class="intro" aria-labelledby="page-title">
                <div>
                  <p class="eyebrow">FIDO2 / CTAP DEVICE MANAGER</p>
                  <h1 id="page-title">Your security keys.<br />Visible and under control.</h1>
                  <p class="lede">
                    FidoManager talks directly to authenticators on this Mac. No account, no cloud,
                    no telemetry.
                  </p>
                </div>

                <button class="refresh-button" type="button" onclick={refreshNow} disabled={refreshing}>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 7v5h-5M4 17v-5h5" />
                    <path d="M6.1 8.2A7 7 0 0 1 18.8 7M17.9 15.8A7 7 0 0 1 5.2 17" />
                  </svg>
                  {refreshing ? 'Scanning…' : 'Scan now'}
                </button>
              </section>

              <section class="system-strip" aria-label="Discovery status">
                <div class="system-item">
                  <span class="system-label">Native service</span>
                  <strong class:warning={discoveryError}>{discoveryError ? 'Attention' : 'Online'}</strong>
                </div>
                <div class="system-item">
                  <span class="system-label">Discovery epoch</span>
                  <strong>{snapshot?.enumerationEpoch ?? '—'}</strong>
                </div>
                <div class="system-item">
                  <span class="system-label">Last scan</span>
                  <strong>{lastScan ?? 'Starting…'}</strong>
                </div>
                <div class="system-item">
                  <span class="system-label">libfido2</span>
                  <strong>{foundation?.reviewedLibfido2Baseline ?? '—'}</strong>
                </div>
              </section>

              {#if discoveryError}
                <div class="error-banner" role="alert">
                  <strong>Discovery paused</strong>
                  <span>{discoveryError}</span>
                </div>
              {/if}

              <section class="devices" aria-labelledby="devices-title">
                <div class="section-heading">
                  <div>
                    <p class="section-kicker">CONNECTED HARDWARE</p>
                    <h2 id="devices-title">Authenticators</h2>
                  </div>
                  <span class="device-count">{snapshot?.devices.length ?? 0} detected</span>
                </div>

                {#if snapshot && snapshot.devices.length > 0}
                  <div class="device-grid">
                    {#each snapshot.devices as device (device.handle)}
                      <article class="device-card">
                        <div class="device-card-head">
                          <div class="key-icon" aria-hidden="true">
                            <div class="key-contact"></div>
                            <div class="key-body">
                              <span></span><span></span><span></span>
                            </div>
                          </div>

                          <div class="device-title">
                            <div class="status-line">
                              <span class:ready={device.readStatus === 'ready'} class="status-dot"></span>
                              <span>{friendlyStatus(device.readStatus)}</span>
                            </div>
                            <h3>{device.product ?? 'FIDO authenticator'}</h3>
                            <p>{device.manufacturer ?? 'Unknown manufacturer'}</p>
                          </div>

                          <div class="vidpid">
                            <span>VID:PID</span>
                            <code>{hex16(device.vendorId)}:{hex16(device.productId)}</code>
                          </div>
                        </div>

                        <div class="chip-row" aria-label="Supported versions and transports">
                          {#each device.versions as version}
                            <span class="chip accent">{version}</span>
                          {/each}
                          {#each device.transports as transport}
                            <span class="chip">{transport.toUpperCase()}</span>
                          {/each}
                        </div>

                        <div class="detail-grid">
                          <div class="detail wide">
                            <span>AAGUID</span>
                            <code>{device.aaguid ?? 'Not reported'}</code>
                          </div>
                          <div class="detail">
                            <span>Generation</span>
                            <strong>{device.generation}</strong>
                          </div>
                          <div class="detail">
                            <span>Freshness</span>
                            <strong>{device.freshness}</strong>
                          </div>
                          <div class="detail">
                            <span>Max message</span>
                            <strong>{device.maxMessageSize ?? '—'}</strong>
                          </div>
                          <div class="detail">
                            <span>Firmware</span>
                            <strong>{device.firmwareVersion ?? '—'}</strong>
                          </div>
                        </div>

                        {#if device.extensions.length > 0 || device.options.length > 0}
                          <div class="capability-block">
                            <span class="capability-label">CAPABILITIES</span>
                            <div class="capability-list">
                              {#each device.extensions as extension}
                                <span>{extension}</span>
                              {/each}
                              {#each device.options.filter((option) => option.enabled) as option}
                                <span>{option.name}</span>
                              {/each}
                            </div>
                          </div>
                        {/if}

                        <footer class="device-footer">
                          <span>Handle</span>
                          <code>{device.handle.slice(0, 8)}…{device.handle.slice(-8)}</code>
                        </footer>
                      </article>
                    {/each}
                  </div>
                {:else if snapshot}
                  <div class="empty-state">
                    <div class="empty-key" aria-hidden="true"></div>
                    <h3>No authenticator connected</h3>
                    <p>Insert a USB FIDO2 security key. FidoManager will detect it automatically.</p>
                    <span>Scanning every second while this alpha is open.</span>
                  </div>
                {:else}
                  <div class="empty-state loading-state">
                    <div class="scanner" aria-hidden="true"></div>
                    <h3>Starting native discovery…</h3>
                    <p>Establishing the local FIDO authority.</p>
                  </div>
                {/if}
              </section>
            </main>

            <footer class="app-footer">
              <span>FidoManager 0.1 alpha</span>
              <span class="footer-separator"></span>
              <span>{foundation?.phase ?? 'Milestone 1'}</span>
              <span class="footer-spacer"></span>
              <span>No secrets leave this device</span>
            </footer>
          </div>
          EOF

          cat > src/styles.css <<'EOF'
          :root {
            font-family:
              Inter,
              ui-sans-serif,
              system-ui,
              -apple-system,
              BlinkMacSystemFont,
              'Segoe UI',
              sans-serif;
            color: #edf1ed;
            background: #0c0f0e;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --bg: #0c0f0e;
            --panel: #121615;
            --panel-raised: #171c1a;
            --line: #29302d;
            --line-strong: #39433f;
            --text: #edf1ed;
            --muted: #89938e;
            --faint: #5f6964;
            --accent: #d8ff55;
            --accent-dim: #252d17;
            --good: #69e6a6;
            --warn: #ffb85c;
            --mono: 'SFMono-Regular', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
          }

          * {
            box-sizing: border-box;
          }

          html,
          body,
          #app {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
          }

          body {
            overflow-x: hidden;
            background: var(--bg);
          }

          button,
          input {
            font: inherit;
          }

          button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
          }

          code {
            font-family: var(--mono);
          }

          .app-frame {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
              linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 32px 32px;
          }

          .topbar {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0 2rem;
            border-bottom: 1px solid var(--line);
            background: rgba(12, 15, 14, 0.94);
          }

          .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
          }

          .brand-mark {
            width: 35px;
            height: 35px;
            position: relative;
            border: 1px solid var(--line-strong);
            border-radius: 9px;
            background: #101412;
          }

          .brand-mark::before,
          .brand-mark::after,
          .brand-mark span {
            content: '';
            position: absolute;
            background: var(--accent);
          }

          .brand-mark::before {
            width: 13px;
            height: 3px;
            left: 7px;
            top: 9px;
          }

          .brand-mark::after {
            width: 3px;
            height: 17px;
            left: 7px;
            top: 9px;
          }

          .brand-mark span:first-child {
            width: 10px;
            height: 3px;
            left: 10px;
            top: 16px;
          }

          .brand-mark span:last-child {
            width: 3px;
            height: 9px;
            left: 17px;
            top: 9px;
          }

          .brand strong,
