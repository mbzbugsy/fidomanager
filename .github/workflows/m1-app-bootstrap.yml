            background: #222b16;
          }

          .refresh-button:disabled {
            opacity: 0.6;
            cursor: default;
          }

          .refresh-button svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .system-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background: var(--panel);
          }

          .system-item {
            min-width: 0;
            padding: 0.95rem 1.05rem;
            border-right: 1px solid var(--line);
          }

          .system-item:last-child {
            border-right: 0;
          }

          .system-label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--faint);
            font-size: 0.66rem;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .system-item strong {
            display: block;
            overflow: hidden;
            color: #cfd6d2;
            font-family: var(--mono);
            font-size: 0.78rem;
            font-weight: 600;
