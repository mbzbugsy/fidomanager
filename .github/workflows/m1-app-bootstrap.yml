            align-items: center;
            gap: 0.55rem;
          }

          .privacy-pill,
          .mode-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-height: 29px;
            padding: 0 0.7rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: #c4cbc7;
            background: #101412;
            font-size: 0.72rem;
            font-weight: 650;
          }

          .privacy-pill i {
