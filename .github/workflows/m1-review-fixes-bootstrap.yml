name: M1 review fixes bootstrap

on:
  push:
    branches:
      - feature/m1-read-only-discovery

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply focused discovery review fixes
        run: python3 .github/scripts/apply-m1-review-fixes.py

      - name: Setup pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.1

      - name: Format and validate focused Rust crates
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy -p fido-core -p fido-worker-protocol -p fido-service --all-targets --locked -- -D warnings
          cargo test -p fido-core -p fido-worker-protocol -p fido-service --all-targets --locked

      - name: Commit fixes and remove bootstrap files
        run: |
          rm .github/workflows/m1-review-fixes-bootstrap.yml
          rm .github/scripts/apply-m1-review-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden M1 discovery worker lifecycle"
          git push origin HEAD:feature/m1-read-only-discovery
