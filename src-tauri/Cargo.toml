[package]
name = "fidomanager-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fidomanager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "=2.7.0"

[features]
default = ["native-pin"]
native-pin = ["fido-service/native-pin"]
native-ui-spike = ["fido-service/native-ui-spike"]
# ADR-017 §5.6 compile-time release-enforcement flavor. Enabled only by the reviewed release
# packaging; never by CI's ad-hoc packaging, a runtime switch, the environment or the renderer.
macos-release-signing = ["fido-service/macos-release-signing"]
# ADR-018 macOS App Sandbox (Mac App Store compatibility) flavor. Compile-time only: replaces the
# single-instance plugin's /tmp socket, which the sandbox denies, with a container-local lock.
# Enabled only by scripts/package-macos-sandbox.py; never a default feature.
macos-app-sandbox = []

[dependencies]
boogoocypher-status = { path = "../crates/boogoocypher-status" }
fido-service = { path = "../crates/fido-service" }
serde.workspace = true
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-single-instance = "=2.4.5"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
