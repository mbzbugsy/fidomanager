[package]
name = "fido-worker"
description = "Killable native FIDO worker process: the only code that links libfido2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The production worker binary needs the real adapter. Library consumers (tests, fixtures) that
# only use the engine and runtime can opt out with `default-features = false`.
default = ["native-libfido2"]
native-libfido2 = ["fido-libfido2/native-libfido2"]

[dependencies]
fido-auth = { path = "../fido-auth" }
fido-core = { path = "../fido-core" }
fido-libfido2 = { path = "../fido-libfido2" }
fido-platform = { path = "../fido-platform" }
fido-worker-protocol = { path = "../fido-worker-protocol" }

[dev-dependencies]
fido-service = { path = "../fido-service" }

[[bin]]
name = "fido-worker"
path = "src/main.rs"

[lints]
workspace = true
