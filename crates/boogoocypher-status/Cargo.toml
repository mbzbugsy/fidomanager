[package]
name = "boogoocypher-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately depends on NO other project crate: the readiness probe is structurally unable to
# receive any local FIDO, PIN, workflow or inventory type. System/web PKI TLS via the platform
# trust store (native-tls); no cookie store, no redirects, no body decoding features.
[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
serde.workspace = true
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
